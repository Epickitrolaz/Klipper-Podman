[server]
host: 0.0.0.0
port: 7125
# The maximum size allowed for a file upload (in MiB).  Default 1024 MiB
max_upload_size: 1024
# Path to klippy Unix Domain Socket
klippy_uds_address: ~/printer_data/comms/klippy.sock

[file_manager]
# post processing for object cancel. Not recommended for low resource SBCs such as a Pi Zero. Default False
enable_object_processing: False

[authorization]
trusted_clients:
    0.0.0.0/0
    ::/0
cors_domains:
    *

# enables partial support of Octoprint API
[octoprint_compat]

# enables moonraker to track and store print history.
[history]

# this enables moonraker announcements for mainsail
[announcements]
subscriptions:
    mainsail

# Update manager required only for KAMP
# While rebuilding containers automatically updates all components, KAMP is just a collection of scripts that sit on the host filesystem
# That's why only KAMP needs to have update manager configured
[update_manager Klipper-Adaptive-Meshing-Purging]
type: git_repo
channel: dev
path: /root/printer_data/config/Klipper-Adaptive-Meshing-Purging
origin: https://github.com/kyleisah/Klipper-Adaptive-Meshing-Purging.git
primary_branch: main
